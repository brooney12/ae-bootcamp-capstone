name: Automate QA Tests

on:
  issue_comment:
    types: [created]

jobs:
  automate:
    name: Automate tests from wiki test plan
    runs-on: ubuntu-latest

    # Only run when:
    # 1. The comment is on a pull request
    # 2. The comment is exactly /automate-tests or starts with /automate-tests<space>
    if: |
      github.event.issue.pull_request != null &&
      (
        github.event.comment.body == '/automate-tests' ||
        startsWith(github.event.comment.body, '/automate-tests ')
      )

    permissions:
      contents: write        # push generated test files to the branch
      pull-requests: write   # post summary comment
      issues: write          # post comments
      models: read           # call GitHub Models API

    steps:
      - name: Fetch PR head ref
        id: pr-ref
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            return pr.head.ref;

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-ref.outputs.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create test branch
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          TEST_BRANCH="qa/automated-tests-pr-${PR_NUMBER}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Delete the remote branch if it already exists (re-run scenario)
          git push origin --delete "${TEST_BRANCH}" 2>/dev/null || true
          git checkout -b "${TEST_BRANCH}"
          echo "TEST_BRANCH=${TEST_BRANCH}" >> "$GITHUB_ENV"

      - name: Post "in progress" reaction
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Fetch wiki test plan
        id: wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # The test plan generator saves pages as Test-Plan-PR-<N>-<sanitized-title>.md
          # so we can't know the exact slug. Clone the wiki and find the right page by prefix.
          WIKI_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_OWNER}/${REPO_NAME}.wiki.git"
          WIKI_DIR="/tmp/wiki-fetch"
          rm -rf "${WIKI_DIR}"

          git clone --depth=1 "${WIKI_REPO}" "${WIKI_DIR}" 2>/dev/null && {
            # Find the first page whose filename starts with Test-Plan-PR-<N>
            MATCH=$(find "${WIKI_DIR}" -maxdepth 1 -name "Test-Plan-PR-${PR_NUMBER}-*.md" | sort | head -n1)
            if [[ -n "${MATCH}" ]]; then
              echo "Found wiki page: ${MATCH}"
              cp "${MATCH}" /tmp/test_plan.md
            else
              echo "No wiki page found matching Test-Plan-PR-${PR_NUMBER}-*.md"
              echo "_No test plan wiki page found for PR #${PR_NUMBER}._" > /tmp/test_plan.md
            fi
          } || {
            echo "Wiki clone failed (wiki may not exist yet)."
            echo "_No test plan wiki page found for PR #${PR_NUMBER}._" > /tmp/test_plan.md
          }

          echo "plan_found=done" >> "$GITHUB_OUTPUT"

      - name: Collect PR diff
        id: diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3.diff" \
            "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/pulls/${PR_NUMBER}" \
            | head -c 65536 > /tmp/pr_diff.patch

          {
            echo 'PR_DIFF<<__EOF__'
            cat /tmp/pr_diff.patch
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - name: Load QA Automation Test Creator agent prompt
        run: |
          set -euo pipefail
          # Strip YAML frontmatter (lines between the first two --- delimiters)
          # and export the agent body as AGENT_PROMPT for use in the next step
          awk 'BEGIN{n=0} /^---/{n++; next} n>=2' \
            .github/agents/qa-automation-test-creator.agent.md > /tmp/agent_prompt.md
          {
            echo 'AGENT_PROMPT<<__EOF__'
            cat /tmp/agent_prompt.md
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - name: Generate test files via GitHub Models
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TRIGGERED_BY: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          node - <<'NODE_SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const token = process.env.GITHUB_TOKEN;
          const prNumber = process.env.PR_NUMBER;
          const repoOwner = process.env.REPO_OWNER;
          const repoName = process.env.REPO_NAME;

          // Read large content directly from temp files — avoids all GITHUB_ENV multiline issues.
          const readFile = (p, fallback) => { try { return fs.readFileSync(p, 'utf8').slice(0, 6144); } catch { return fallback; } };
          const testPlan    = readFile('/tmp/test_plan.md',   '_No test plan available._');
          const prDiff      = readFile('/tmp/pr_diff.patch',  '_No diff available._');
          const agentPrompt = readFile('/tmp/agent_prompt.md', '');

          async function main() {
            const endpoint = 'https://models.inference.ai.azure.com';
            // gpt-4o-mini has a 128K context window vs gpt-4o's 8K limit on the free tier.
            const model = 'gpt-4o-mini';

            // Use a delimiter format instead of JSON — avoids all JSON-escaping issues
            // with code content (backslashes, template literals, regex, etc.)
            const systemPrompt = agentPrompt + `\n\n## Workflow Output Contract\nDo NOT output JSON. Output each file using this exact delimiter format:\n\n<<<FILE: path/to/file.ext>>>\n<full raw file content here>\n<<<END FILE>>>\n\nRepeat for every file. No other text before, between, or after the blocks.\nIf the test plan has no actionable tests, output exactly: NO_TESTS`;

            const userPrompt = `## PR #${prNumber} — QA Test Plan (from Wiki)\n${testPlan}\n\n## PR Diff (for context on source code)\n\`\`\`diff\n${prDiff}\n\`\`\`\n\nGenerate the test files now.`;

            const response = await fetch(`${endpoint}/chat/completions`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
              },
              body: JSON.stringify({
                model,
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt },
                ],
                temperature: 0.2,
                max_tokens: 3000,
              }),
            });

            if (!response.ok) {
              const err = await response.text();
              throw new Error(`Models API error ${response.status}: ${err}`);
            }

            const data = await response.json();
            const raw = data.choices[0].message.content.trim();

            if (raw === 'NO_TESTS' || raw === '') {
              console.log('No test files to write.');
              fs.writeFileSync('/tmp/test_summary.md', '_No test files were generated (test plan may be empty)._\n');
              return;
            }

            // Parse delimiter format: <<<FILE: path>>>\ncontent\n<<<END FILE>>>
            const filePattern = /<<<FILE:\s*(.+?)>>>([\s\S]*?)<<<END FILE>>>/g;
            const files = [];
            let m;
            while ((m = filePattern.exec(raw)) !== null) {
              files.push({ filePath: m[1].trim(), content: m[2].replace(/^\n/, '') });
            }

            if (files.length === 0) {
              console.log('No file blocks found in model output. Raw output:\n' + raw.slice(0, 500));
              fs.writeFileSync('/tmp/test_summary.md', '_No test files were generated (model output could not be parsed)._\n');
              return;
            }

            const written = [];
            for (const { filePath, content } of files) {
              const abs = path.resolve(process.cwd(), filePath);
              fs.mkdirSync(path.dirname(abs), { recursive: true });
              fs.writeFileSync(abs, content, 'utf8');
              written.push(filePath);
              console.log(`Wrote: ${filePath}`);
            }

            // Write file list for later use by the PR-open step
            fs.writeFileSync('/tmp/written_files.json', JSON.stringify(written), 'utf8');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          NODE_SCRIPT

      - name: Commit and push test branch
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit — no test files were generated."
            echo "TESTS_COMMITTED=false" >> "$GITHUB_ENV"
          else
            git commit -m "test: add automated tests generated from wiki test plan [skip ci]"
            git push origin "HEAD:${TEST_BRANCH}"
            echo "TESTS_COMMITTED=true" >> "$GITHUB_ENV"
          fi

      - name: Open pull request for test branch
        id: open-pr
        if: env.TESTS_COMMITTED == 'true'
        uses: actions/github-script@v7
        env:
          PR_HEAD_REF: ${{ steps.pr-ref.outputs.head_ref }}
          PR_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = process.env.PR_NUMBER;
            const testBranch = process.env.TEST_BRANCH;
            const targetBranch = process.env.PR_HEAD_REF;

            let written = [];
            try { written = JSON.parse(fs.readFileSync('/tmp/written_files.json', 'utf8')); } catch {}

            // Count test cases in a file by matching `it(` / `test(` lines
            // (excludes test.beforeEach, test.describe, test.use, etc.)
            function countTests(filePath) {
              try {
                const content = fs.readFileSync(filePath, 'utf8');
                return (content.match(/^\s*(?:it|test)\s*\(/gm) || []).length;
              } catch { return 0; }
            }

            // Classify each file into a tier + runner
            function classify(filePath) {
              if (/e2e[\\/]pages[\\/]/.test(filePath))        return { tier: 'Page Object', runner: 'Playwright' };
              if (/e2e[\\/]/.test(filePath))                   return { tier: 'E2E',         runner: 'Playwright' };
              if (/integrat/i.test(filePath))                  return { tier: 'Integration', runner: 'Vitest' };
              return                                                  { tier: 'Unit',         runner: 'Vitest' };
            }

            // Build per-file data
            const fileData = written.map(f => {
              const { tier, runner } = classify(f);
              const count = tier === 'Page Object' ? null : countTests(f);
              return { file: f, tier, runner, count };
            });

            // Aggregate distribution totals (skip Page Objects)
            const totals = { Unit: 0, Integration: 0, E2E: 0 };
            for (const { tier, count } of fileData) {
              if (count !== null && tier in totals) totals[tier] += count;
            }

            const fileList = written.map(f => `- \`${f}\``).join('\n');

            // Per-file table rows
            const rows = fileData.map(({ file, tier, runner, count }) =>
              `| \`${file}\` | ${count === null ? '— (Page Object)' : count} | ${runner} | ${tier} |`
            ).join('\n');

            // Distribution summary rows
            const distRows = Object.entries(totals)
              .map(([tier, n]) => `| ${tier} | ${n} |`)
              .join('\n');

            const prBody = [
              `## 🤖 Automated Tests — PR #${prNumber}`,
              ``,
              `This PR was generated automatically from the [wiki test plan](../../wiki/Test-Plan-PR-${prNumber}).`,
              ``,
              `### Files created`,
              fileList,
              ``,
              `> Powered by GitHub Models · gpt-4o-mini`,
            ].join('\n');

            let prUrl = null;
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `test: automated tests for PR #${prNumber}`,
                head: testBranch,
                base: targetBranch,
                body: prBody,
              });
              prUrl = pr.html_url;
              core.setOutput('pr_url', prUrl);
              core.setOutput('pr_number', String(pr.number));
            } catch (err) {
              if (err.status === 403) {
                core.warning('Could not auto-create PR (Actions PR creation is disabled in repo settings). ' +
                  'Enable it under Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".');
              } else {
                throw err;
              }
            }

            // Build the summary comment for the original PR
            const compareUrl = `${context.payload.repository.html_url}/compare/${targetBranch}...${testBranch}`;
            const summary = [
              `## 🤖 Automated Test Files Generated`,
              ``,
              `Test files have been committed to branch \`${testBranch}\`.`,
              prUrl
                ? `A pull request has been opened: **[test: automated tests for PR #${prNumber}](${prUrl})**`
                : `⚠️ Auto PR creation is disabled. **[Open the PR manually](${compareUrl})**`,
              ``,
              `### Test distribution`,
              `| Tier | Tests |`,
              `|------|-------|`,
              distRows,
              ``,
              `### Generated files`,
              `| File | Tests | Runner | Tier |`,
              `|------|-------|--------|------|`,
              rows,
              ``,
              `> Generated from the [wiki test plan](../../wiki/Test-Plan-PR-${prNumber}) · Powered by GitHub Models gpt-4o-mini`,
            ].join('\n');
            require('fs').writeFileSync('/tmp/test_summary.md', summary, 'utf8');

      - name: Write no-op summary
        if: env.TESTS_COMMITTED != 'true'
        run: |
          echo '_No test files were generated (test plan may be empty)._' > /tmp/test_summary.md

      - name: Post summary comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('/tmp/test_summary.md', 'utf8');
            } catch {
              body = '## ⚠️ Test automation completed\n\nNo summary file was produced. Check the [workflow run](' +
                context.payload.repository.html_url + '/actions/runs/' + context.runId + ') for details.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

      - name: Post success reaction
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '## ❌ Test automation failed',
                '',
                'Something went wrong generating or committing the test files.',
                `Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
                '',
                'You can retry by commenting `/automate-tests` again.',
              ].join('\n'),
            });
