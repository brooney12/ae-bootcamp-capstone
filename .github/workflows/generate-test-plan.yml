name: Generate QA Test Plan

on:
  issue_comment:
    types: [created]

jobs:
  generate:
    name: Generate test plan
    runs-on: ubuntu-latest

    # Only run when:
    # 1. The comment is on a pull request (not a plain issue)
    # 2. The comment starts with /generate-test-plan (optionally with guidance)
    # 3. The comment is not the MCP command variant
    if: |
      github.event.issue.pull_request != null &&
      (
        github.event.comment.body == '/generate-test-plan' ||
        startsWith(github.event.comment.body, '/generate-test-plan ')
      )

    permissions:
      contents: write        # needed to push to wiki
      pull-requests: write   # needed to post comments
      issues: write          # needed to post comments (same as pull-requests for PRs)
      models: read           # needed to call GitHub Models API

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @octokit/rest node-fetch

      - name: Post "in progress" reaction
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Generate test plan
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TRIGGERED_BY: ${{ github.event.comment.user.login }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
        run: node scripts/generate_test_plan.cjs

      - name: Post success reaction
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                `## ❌ Test plan generation failed`,
                ``,
                `Something went wrong generating the test plan. Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
                ``,
                `You can retry by commenting \`/generate-test-plan\` again.`,
              ].join('\n'),
            });
