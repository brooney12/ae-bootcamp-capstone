name: "Generate QA Test Plan (MCP)"

on:
  issue_comment:
    types: [created]

jobs:
  generate:
    name: Generate test plan with MCP
    runs-on: ubuntu-latest

    if: |
      github.event.issue.pull_request != null &&
      (
        github.event.comment.body == '/generate-test-plan-mcp' ||
        startsWith(github.event.comment.body, '/generate-test-plan-mcp ')
      )

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post "in progress" reaction
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Generate MCP test plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TRIGGERED_BY: ${{ github.event.comment.user.login }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          # Optional: set your org-specific billing assumption per premium request.
          # MCP_PREMIUM_REQUEST_COST_USD: "0.04"
        run: node scripts/generate_test_plan_mcp.cjs

      - name: Post success reaction
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                `## ❌ MCP test plan generation failed`,
                ``,
                `The MCP workflow failed. Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
                ``,
                `Retry with \`/generate-test-plan-mcp\` after resolving the issue.`,
              ].join('\n'),
            });
